name: PitPulseMobile
options:
  bundleIdPrefix: com.pitpulse
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: zh-Hans
packages:
  PitPulseKit:
    path: ../Packages/PitPulseKit
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  PitPulseMobile:
    type: application
    platform: iOS
    sources:
      - path: PitPulseMobile
    info:
      path: PitPulseMobile/Info.plist
      properties:
        CFBundleDisplayName: PitPulse
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSupportsIndirectInputEvents: true
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
          NSExceptionDomains:
            localhost:
              NSExceptionAllowsInsecureHTTPLoads: true
              NSIncludesSubdomains: true
    dependencies:
      - package: PitPulseKit
        product: PitPulseShared
      - package: PitPulseKit
        product: PitPulseData
      - package: PitPulseKit
        product: PitPulseComponents
      - target: PitPulseLiveActivity
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pitpulse.mobile
        PRODUCT_NAME: PitPulse
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  PitPulseLiveActivity:
    type: app-extension
    platform: iOS
    sources:
      - path: PitPulseLiveActivity
    info:
      path: PitPulseLiveActivity/Info.plist
      properties:
        CFBundleDisplayName: PitPulse Live
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    dependencies:
      - package: PitPulseKit
        product: PitPulseShared
      - package: PitPulseKit
        product: PitPulseComponents
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pitpulse.mobile.liveactivity
        PRODUCT_NAME: PitPulseLiveActivity
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
  PitPulseMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: PitPulseMobileTests
    dependencies:
      - package: PitPulseKit
        product: PitPulseShared
      - package: PitPulseKit
        product: PitPulseData
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pitpulse.mobile.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  PitPulseMobile:
    build:
      targets:
        PitPulseMobile: all
        PitPulseLiveActivity: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - PitPulseMobileTests
    archive:
      config: Release
  PitPulseLiveActivity:
    build:
      targets:
        PitPulseLiveActivity: all
    run:
      config: Debug
