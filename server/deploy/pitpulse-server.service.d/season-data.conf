[Service]
Environment=PITPULSE_PUBLISH_SOCKET=/run/pitpulse-publisher/sync.sock
EnvironmentFile=-/etc/pitpulse/season.env
EnvironmentFile=-/etc/pitpulse/reader.env
ExecStartPre=/bin/sh -ec 'if [ -f /etc/pitpulse/reader.env ]; then test -n "$$PITPULSE_SEASON_READ_DATABASE_URL" && test "$$F1_COMPANION_DATABASE_PATH" = /var/lib/pitpulse/reader.sqlite; fi'
SupplementaryGroups=pitpulse-socket
UnsetEnvironment=PITPULSE_SEASON_WRITE_DATABASE_URL
