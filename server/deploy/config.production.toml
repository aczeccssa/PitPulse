[server]
bind = "127.0.0.1:38701"

[database]
path = "/var/lib/pitpulse/pitpulse.sqlite"

[providers]
jolpica_enabled = true
openf1_enabled = true
f1_live_enabled = true
wec_live_enabled = false
wec_live_poll_seconds = 5
user_agent = "PitPulse/0.1"

[live]
snapshot_interval_seconds = 15
stale_after_seconds = 60
disconnect_after_seconds = 120

[security]
require_token = true
# F1_COMPANION_TOKEN is read from /etc/pitpulse/environment, never from this file.

[scheduler]
calendar_interval_seconds = 21600
standings_interval_seconds = 21600
