version: 1
session: PitPulse
task_order:
- Run Live Replay
- Run App
- Build App
- Build App Release
- Build App Tests
- Build iOS
- Test iOS
- Check Widget Publisher
- Check App Launcher
- Connect Simulator Replay
tasks:
  Build App:
    command: /bin/bash
    args:
    - scripts/xcode-task.sh
    - build
    - Debug
    cwd: .
    env: {}
    shell: true
    auto_start: false
    stop_timeout_ms: 3000
    clear_logs_on_restart: false
  Build App Release:
    command: /bin/bash
    args:
    - scripts/xcode-task.sh
    - build
    - Release
    cwd: .
    env: {}
    shell: true
    auto_start: false
    stop_timeout_ms: 3000
    clear_logs_on_restart: false
  Build App Tests:
    command: /bin/bash
    args:
    - scripts/xcode-task.sh
    - build-for-testing
    - Debug
    cwd: .
    env: {}
    shell: true
    auto_start: false
    stop_timeout_ms: 3000
    clear_logs_on_restart: false
  Build iOS:
    command: /bin/bash
    args:
    - scripts/xcode-ios-task.sh
    - build
    - Debug
    cwd: .
    env: {}
    shell: true
    auto_start: false
    stop_timeout_ms: 3000
    clear_logs_on_restart: false
  Check App Launcher:
    command: /bin/bash
    args:
    - scripts/run-app.sh
    - --check
    cwd: .
    env: {}
    shell: false
    auto_start: false
    stop_timeout_ms: 3000
    clear_logs_on_restart: false
  Check Widget Publisher:
    command: /bin/bash
    args:
    - scripts/check-widget-publisher.sh
    cwd: .
    env: {}
    shell: true
    auto_start: false
    stop_timeout_ms: 3000
    clear_logs_on_restart: false
  Connect Simulator Replay:
    command: /usr/bin/python3
    args:
    - scripts/connect-ios-replay.py
    cwd: .
    env: {}
    shell: false
    auto_start: false
    stop_timeout_ms: 3000
    clear_logs_on_restart: true
  Run App:
    command: /bin/bash
    args:
    - scripts/run-app.sh
    cwd: .
    env: {}
    shell: false
    auto_start: false
    stop_timeout_ms: 10000
    clear_logs_on_restart: true
  Run Live Replay:
    command: /usr/bin/python3
    args:
    - scripts/run-live-replay.py
    cwd: .
    env: {}
    shell: false
    auto_start: false
    stop_timeout_ms: 10000
    clear_logs_on_restart: false
  Test iOS:
    command: /bin/bash
    args:
    - scripts/xcode-ios-task.sh
    - test
    - Debug
    cwd: .
    env: {}
    shell: true
    auto_start: false
    stop_timeout_ms: 3000
    clear_logs_on_restart: false
