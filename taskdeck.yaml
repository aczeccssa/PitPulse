version: 1
session: PitPulse
task_order:
- Run Server
- Run App
- Build App
- Build App Tests
- Build App Release
- Build iOS
- Test iOS
- Test Server
- Check Server Format
- Lint Server
- Check Task Report
tasks:
  Build App:
    command: /bin/bash
    args:
    - scripts/xcode-task.sh
    - build
    - Debug
    cwd: .
    env: {}
    shell: false
    auto_start: false
    stop_timeout_ms: 3000
    clear_logs_on_restart: true
  Build App Release:
    command: /bin/bash
    args:
    - scripts/xcode-task.sh
    - build
    - Release
    cwd: .
    env: {}
    shell: false
    auto_start: false
    stop_timeout_ms: 3000
    clear_logs_on_restart: true
  Build App Tests:
    command: /bin/bash
    args:
    - scripts/xcode-task.sh
    - build-for-testing
    - Debug
    cwd: .
    env: {}
    shell: false
    auto_start: false
    stop_timeout_ms: 3000
    clear_logs_on_restart: true
  Build iOS:
    command: /bin/bash
    args:
    - scripts/xcode-ios-task.sh
    - build
    - Debug
    cwd: .
    env: {}
    shell: false
    auto_start: false
    stop_timeout_ms: 3000
    clear_logs_on_restart: true
  Check Server Format:
    command: cargo
    args:
    - fmt
    - --manifest-path
    - server/Cargo.toml
    - --
    - --check
    cwd: .
    env: {}
    shell: false
    auto_start: false
    stop_timeout_ms: 3000
    clear_logs_on_restart: false
  Check Task Report:
    command: /bin/zsh
    args:
    - -lc
    - node docs/tasks/validate.mjs && node --test docs/tasks/tests/task-data.test.mjs && node --check docs/tasks/board.js
    cwd: .
    env: {}
    shell: false
    auto_start: false
    stop_timeout_ms: 3000
    clear_logs_on_restart: false
  Lint Server:
    command: cargo
    args:
    - clippy
    - --locked
    - --manifest-path
    - server/Cargo.toml
    - --all-targets
    - --
    - -D
    - warnings
    cwd: .
    env: {}
    shell: false
    auto_start: false
    stop_timeout_ms: 3000
    clear_logs_on_restart: false
  Run App:
    command: /bin/zsh
    args:
    - -lc
    - exec scripts/run-app.sh
    cwd: .
    env: {}
    shell: false
    auto_start: false
    stop_timeout_ms: 5000
    clear_logs_on_restart: true
  Run Server:
    command: /bin/zsh
    args:
    - -lc
    - exec python3 scripts/run-server.py
    cwd: .
    env:
      F1_COMPANION_BIND: 0.0.0.0:38701
    shell: false
    auto_start: false
    stop_timeout_ms: 10000
    clear_logs_on_restart: false
  Test Server:
    command: cargo
    args:
    - test
    - --locked
    - --manifest-path
    - server/Cargo.toml
    cwd: .
    env: {}
    shell: false
    auto_start: false
    stop_timeout_ms: 3000
    clear_logs_on_restart: false
  Test iOS:
    command: /bin/bash
    args:
    - scripts/xcode-ios-task.sh
    - test
    - Debug
    cwd: .
    env: {}
    shell: false
    auto_start: false
    stop_timeout_ms: 3000
    clear_logs_on_restart: true
