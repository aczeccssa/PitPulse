version: 1
session: PitPulse
task_order:
- Build App
- Build App Tests
- Build App Release
- Build iOS
- Test iOS
- Test Server
- Check Server Format
- Lint Server
- Check Task Report
- Run Server
- Run App
tasks:
  Run App:
    command: /bin/zsh
    args:
    - -lc
    - exec scripts/run-app.sh
    cwd: .
    env: {}
    shell: false
    auto_start: false
    stop_timeout_ms: 5000
    clear_logs_on_restart: true
  Run Server:
    command: /bin/zsh
    args:
    - -lc
    - exec python3 scripts/run-server.py
    cwd: .
    env:
      F1_COMPANION_LIVE_INTERFACE: en0
    shell: false
    auto_start: false
    stop_timeout_ms: 10000
    clear_logs_on_restart: false
  Build App:
    command: /bin/bash
    args: [scripts/xcode-task.sh, build, Debug]
    cwd: .
    env: {}
    shell: false
    auto_start: false
    clear_logs_on_restart: true
  Build App Tests:
    command: /bin/bash
    args: [scripts/xcode-task.sh, build-for-testing, Debug]
    cwd: .
    env: {}
    shell: false
    auto_start: false
    clear_logs_on_restart: true
  Build App Release:
    command: /bin/bash
    args: [scripts/xcode-task.sh, build, Release]
    cwd: .
    env: {}
    shell: false
    auto_start: false
    clear_logs_on_restart: true
  Build iOS:
    command: /bin/bash
    args: [scripts/xcode-ios-task.sh, build, Debug]
    cwd: .
    env: {}
    shell: false
    auto_start: false
    clear_logs_on_restart: true
  Test iOS:
    command: /bin/bash
    args: [scripts/xcode-ios-task.sh, test, Debug]
    cwd: .
    env: {}
    shell: false
    auto_start: false
    clear_logs_on_restart: true
  Test Server:
    command: cargo
    args: [test, --locked, --manifest-path, server/Cargo.toml]
    cwd: .
    env: {}
    shell: false
    auto_start: false
  Check Server Format:
    command: cargo
    args: [fmt, --manifest-path, server/Cargo.toml, --, --check]
    cwd: .
    env: {}
    shell: false
    auto_start: false
  Lint Server:
    command: cargo
    args: [clippy, --locked, --manifest-path, server/Cargo.toml, --all-targets, --, -D, warnings]
    cwd: .
    env: {}
    shell: false
    auto_start: false
  Check Task Report:
    command: /bin/zsh
    args:
    - -lc
    - node docs/tasks/validate.mjs && node --test docs/tasks/tests/task-data.test.mjs && node --check docs/tasks/board.js
    cwd: .
    env: {}
    shell: false
    auto_start: false
