name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  server:
    name: Server fmt / clippy / test / build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - name: Install linker dependencies
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends pkg-config libssl-dev
      - name: Format
        run: cargo fmt --manifest-path server/Cargo.toml -- --check
      - name: Clippy
        run: cargo clippy --locked --manifest-path server/Cargo.toml --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --manifest-path server/Cargo.toml
      - name: Build release
        run: cargo build --release --locked --manifest-path server/Cargo.toml
      - name: Smoke-test the embedded web dashboard
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          token="ci-smoke-token-0123456789abcdefghij"
          F1_COMPANION_BIND=127.0.0.1:38711 \
          F1_COMPANION_DATABASE_PATH="$tmp/smoke.sqlite" \
          F1_COMPANION_REQUIRE_TOKEN=1 \
          F1_COMPANION_TOKEN="$token" \
            server/target/release/pitpulse-server > "$tmp/server.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for _ in $(seq 1 60); do
            if [[ "$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:38711/ || true)" == "200" ]]; then break; fi
            sleep 1
          done
          # The shell is served directly and issues its own read-only session.
          status="$(curl -sS -c "$tmp/cookies.txt" -o "$tmp/index.html" -w '%{http_code}' \
            http://127.0.0.1:38711/ || { cat "$tmp/server.log"; exit 1; })"
          test "$status" = "200"
          grep -q 'href="/app.css"' "$tmp/index.html"
          grep -q 'src="/app.js"' "$tmp/index.html"
          ! grep -q 'auth-dialog' "$tmp/index.html"
          grep -q 'pitpulse_web' "$tmp/cookies.txt"
          # Direct links and the public liveness probe resolve without a key.
          for path in /index /home /results/2025%3A1/race /health; do
            status="$(curl -sS -o /dev/null -w '%{http_code}' "http://127.0.0.1:38711$path")"
            test "$status" = "200"
          done
          # The explicit access link still re-issues the session on demand.
          status="$(curl -sS -c "$tmp/link-cookies.txt" -o /dev/null -w '%{http_code}' \
            --get --data-urlencode "token=$token" http://127.0.0.1:38711/)"
          test "$status" = "303"
          curl -fsS -b "$tmp/cookies.txt" http://127.0.0.1:38711/app.css -o /dev/null
          curl -fsS -b "$tmp/cookies.txt" http://127.0.0.1:38711/app.js -o /dev/null
          curl -fsS -b "$tmp/cookies.txt" http://127.0.0.1:38711/manifest.webmanifest -o /dev/null
          status="$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:38711/api/v1/health)"
          test "$status" = "401"
          # The browser session reads data but must not be able to write.
          curl -fsS -b "$tmp/cookies.txt" http://127.0.0.1:38711/api/v1/health | grep -q '"status":"ok"'
          status="$(curl -sS -b "$tmp/cookies.txt" -X POST \
            -H 'Content-Type: application/json' -d '{"season":2026,"target":"calendar"}' \
            -o /dev/null -w '%{http_code}' http://127.0.0.1:38711/api/v1/refresh)"
          test "$status" = "401"
          curl -fsS -H "Authorization: Bearer $token" \
            http://127.0.0.1:38711/api/v1/health | grep -q '"status":"ok"'
          curl -fsS -H "Authorization: Bearer $token" \
            -o /dev/null http://127.0.0.1:38711/api/v1/calendar
      - name: Package Linux x86-64 release artifact
        run: |
          set -euo pipefail
          sha="${GITHUB_SHA}"
          stage="${RUNNER_TEMP}/pitpulse-release"
          artifact="pitpulse-server-linux-x86_64-${sha}.tar.gz"
          mkdir -p "$stage"
          install -m 0755 server/target/release/pitpulse-server "$stage/pitpulse-server"
          printf '%s\n' "$sha" > "$stage/VERSION"
          ldd "$stage/pitpulse-server" > "$stage/ldd.txt"
          ! grep -q 'not found' "$stage/ldd.txt"
          install -m 0644 server/deploy/config.production.toml "$stage/config.production.toml"
          install -m 0644 server/deploy/pitpulse-server.service "$stage/pitpulse-server.service"
          install -m 0644 server/deploy/pitpulse.caddyfile "$stage/pitpulse.caddyfile"
          (
            cd "$stage"
            sha256sum pitpulse-server VERSION ldd.txt config.production.toml \
              pitpulse-server.service pitpulse.caddyfile > SHA256SUMS
          )
          tar -czf "$artifact" -C "$stage" \
            pitpulse-server VERSION ldd.txt SHA256SUMS \
            config.production.toml pitpulse-server.service pitpulse.caddyfile
          sha256sum "$artifact" > "$artifact.sha256"
          printf 'ARTIFACT=%s\n' "$artifact" >> "$GITHUB_ENV"
      - name: Upload Linux x86-64 release artifact
        uses: actions/upload-artifact@v7
        with:
          name: pitpulse-server-linux-x86_64-${{ github.sha }}
          path: |
            ${{ env.ARTIFACT }}
            ${{ env.ARTIFACT }}.sha256
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS build / test
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Build for testing
        run: >-
          xcodebuild
          -workspace PitPulse.xcworkspace
          -scheme PitPulseDesktop
          -configuration Debug
          -destination 'platform=macOS'
          -derivedDataPath "$RUNNER_TEMP/PitPulseDerivedData"
          CODE_SIGNING_ALLOWED=NO
          build-for-testing
