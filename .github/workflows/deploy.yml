name: Deploy PitPulse Server

on:
  workflow_dispatch:
    inputs:
      artifact_run_id:
        description: CI workflow run ID that produced the release artifact
        required: true
        type: string
      commit_sha:
        description: Full commit SHA to deploy (must match the artifact VERSION)
        required: true
        type: string

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    name: Manual production deployment
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.commit_sha }}

      - name: Validate requested commit and approved CI source
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
          CI_RUN_ID: ${{ inputs.artifact_run_id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git rev-parse --verify 'HEAD^{commit}' >/dev/null
          test "$REQUESTED_SHA" = "$(git rev-parse HEAD)"
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "commit_sha must be a full lowercase SHA" >&2; exit 1; }
          [[ "$CI_RUN_ID" =~ ^[0-9]+$ ]] || { echo "artifact_run_id must be numeric" >&2; exit 1; }

          run="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID")"
          server_jobs="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID/jobs?per_page=100")"
          jq -e --arg sha "$REQUESTED_SHA" '
            .name == "CI" and .path == ".github/workflows/ci.yml"
            and .event == "push" and .head_branch == "main"
            and .head_sha == $sha and .status == "completed" and .conclusion == "success"
          ' <<<"$run" >/dev/null
          jq -e '[.jobs[] | select(.name == "Server fmt / clippy / test / build")] |
            length == 1 and .[0].status == "completed" and .[0].conclusion == "success"
          ' <<<"$server_jobs" >/dev/null
          artifact="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$CI_RUN_ID/artifacts?per_page=100" \
            --jq --arg sha "$REQUESTED_SHA" '
              [.artifacts[] | select(
                .name == ("pitpulse-server-linux-x86_64-" + $sha)
                and .expired == false
                and .workflow_run.head_branch == "main"
                and .workflow_run.head_sha == $sha
              )] | if length == 1 then .[0] else error("expected exactly one release artifact") end
            ')"
          artifact_id="$(jq -r '.id' <<<"$artifact")"
          digest="$(jq -r '.digest' <<<"$artifact")"
          [[ "$artifact_id" =~ ^[0-9]+$ && "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] ||
            { echo "artifact ID or published ZIP digest is invalid" >&2; exit 1; }
          printf '%s\n' "$artifact_id" > "$RUNNER_TEMP/expected-artifact-id"
          printf '%s\n' "${digest#sha256:}" > "$RUNNER_TEMP/expected-artifact-digest"

      - name: Download and verify GitHub-published artifact ZIP
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha="$REQUESTED_SHA"
          artifact_id="$(cat "$RUNNER_TEMP/expected-artifact-id")"
          expected_digest="$(cat "$RUNNER_TEMP/expected-artifact-digest")"
          zip="$RUNNER_TEMP/pitpulse-artifact.zip"
          # Read the signed artifact redirect with the GitHub token, then fetch
          # the object-storage URL without forwarding that token.
          location="$(curl -fsS -D - -o /dev/null \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" |
            awk 'tolower($1)=="location:" {print $2}' | tr -d '\r' | tail -n 1)"
          [[ "$location" == https://*.blob.core.windows.net/* ]] ||
            { echo "unexpected artifact redirect host" >&2; exit 1; }
          curl -fsSL "$location" -o "$zip"
          # GitHub's artifact digest covers the ZIP bytes, not the .tar.gz
          # member. Keep this exact ZIP for the independent VPS-side check.
          test "$(sha256sum "$zip" | cut -d' ' -f1)" = "$expected_digest"
          mkdir -p release
          unzip -q "$zip" -d release
          archive="release/pitpulse-server-linux-x86_64-${sha}.tar.gz"
          checksum="${archive}.sha256"
          test -f "$archive" && test -f "$checksum"
          (cd release && sha256sum -c "$(basename "$checksum")")
          mkdir -p release/extracted
          tar -xzf "$archive" -C release/extracted
          test "$(tr -d '[:space:]' < release/extracted/VERSION)" = "$sha"
          (cd release/extracted && sha256sum -c SHA256SUMS)

      - name: Configure dedicated SSH key
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          for name in VPS_HOST VPS_USER VPS_KNOWN_HOSTS VPS_SSH_KEY; do
            [[ -n "${!name}" ]] || { echo "Missing deployment secret: $name" >&2; exit 1; }
          done
          [[ "$VPS_HOST" =~ ^[A-Za-z0-9.-]+$ && "$VPS_HOST" != *..* && "$VPS_HOST" != -* ]] ||
            { echo "VPS_HOST is not a safe hostname" >&2; exit 1; }
          [[ "$VPS_USER" =~ ^[a-z_][a-z0-9_-]*$ && "$VPS_USER" != root ]] ||
            { echo "VPS_USER is not a dedicated non-root account" >&2; exit 1; }
          ssh_dir="$RUNNER_TEMP/pitpulse-ssh"
          install -d -m 0700 "$ssh_dir"
          install -m 0600 /dev/null "$ssh_dir/known_hosts"
          printf '%s\n' "$VPS_KNOWN_HOSTS" > "$ssh_dir/known_hosts"
          install -m 0600 /dev/null "$ssh_dir/id_ed25519"
          printf '%s\n' "$VPS_SSH_KEY" > "$ssh_dir/id_ed25519"
          {
            printf 'Host pitpulse-deploy\n'
            printf '  HostName %s\n' "$VPS_HOST"
            printf '  User %s\n' "$VPS_USER"
            printf '  IdentityFile %s\n' "$ssh_dir/id_ed25519"
            printf '  IdentitiesOnly yes\n'
            printf '  BatchMode yes\n'
            printf '  StrictHostKeyChecking yes\n'
            printf '  UserKnownHostsFile %s\n' "$ssh_dir/known_hosts"
          } > "$ssh_dir/config"
          chmod 0600 "$ssh_dir/config"

      - name: Upload artifact and trusted helpers through the forced command
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          sha="$REQUESTED_SHA"
          zip="$RUNNER_TEMP/pitpulse-artifact.zip"
          ssh_config="$RUNNER_TEMP/pitpulse-ssh/config"
          bundle="$RUNNER_TEMP/pitpulse-deploy-scripts.tar.gz"
          helpers="$RUNNER_TEMP/pitpulse-deploy-scripts"
          mkdir -p "$helpers"
          cp server/deploy/lib.sh server/deploy/deploy-release.sh \
            server/deploy/rollback-release.sh "$helpers/"
          tar -czf "$bundle" -C "$helpers" \
            lib.sh deploy-release.sh rollback-release.sh
          request_digest="$(sha256sum "$zip" | cut -d' ' -f1)"
          printf '%s %s\n' "$sha" "$request_digest" |
            base64 -w 0 > "$RUNNER_TEMP/pitpulse-deploy-request.b64"
          {
            cat "$RUNNER_TEMP/pitpulse-deploy-request.b64"
            printf '\n'
            cat "$zip"
          } | ssh -F "$ssh_config" pitpulse-deploy "put ${sha}"
          base64 -w 0 "$bundle" | ssh -F "$ssh_config" pitpulse-deploy "deploy ${sha}"

      - name: Clean remote staging and runner secrets
        if: always()
        env:
          REQUESTED_SHA: ${{ inputs.commit_sha }}
        run: |
          ssh_config="$RUNNER_TEMP/pitpulse-ssh/config"
          if [[ -f "$ssh_config" ]]; then
            ssh -F "$ssh_config" -o ConnectTimeout=10 \
              pitpulse-deploy "cleanup ${REQUESTED_SHA}" || true
          fi
          rm -rf "$RUNNER_TEMP/pitpulse-ssh" \
            "$RUNNER_TEMP/pitpulse-deploy-scripts" \
            "$GITHUB_WORKSPACE/release"
          rm -f "$RUNNER_TEMP/pitpulse-artifact.zip" \
            "$RUNNER_TEMP/pitpulse-deploy-scripts.tar.gz" \
            "$RUNNER_TEMP/pitpulse-deploy-request.b64" \
            "$RUNNER_TEMP/expected-artifact-id" \
            "$RUNNER_TEMP/expected-artifact-digest"
